  <body>
    <div class="register-container" >
      <main class="row">
        <h2>Simple User Registration Form</h2>

        <div class="col-6">
          <form class="simple" id="simple">
            <input type="hidden" id="type" name="type" value="user" />

            <!-- username -->
            <label for="username">*Username</label>
            <input
              id="username"
              name="username"
              type="text"
              required
              placeholder="Username"
              pattern="^[A-Za-z][A-Za-z0-9]{5,}$"
              title="Παρακαλώ εισάγετε τουλάχιστον 6 χαρακτήρες. Επιτρέπονται μόνο λατινικά γράμματα & αριθμοί."
            />
            <div id="username-msg" class="field-msg"></div>

            <!-- email -->
            <label for="email">*Email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              placeholder="example@domain.com"
              title="Παρακαλώ εισάγετε έγκυρο email ."
            />
            <div id="email-msg" class="field-msg"></div>

            <!-- password -->
            <label for="password">*Κωδικός χρήστη</label>
            <div class="password-row">
              <div class="input-wrapper position-relative">
                <button
                  type="button"
                  id="check-button"
                  style="cursor: pointer"
                  onclick="Strength()"
                >
                  Check Strength
                </button>
                <input
                  id="password"
                  name="password"
                  type="password"
                  required
                  pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#\$%\^\&\*\(\)\_\+\-\=\[\]\{\}\;\'\:\\|\,\.\?]).{8,14}$"
                  title="Εισάγετε 8-14 χαρακτήρες, τουλάχιστον 1 κεφαλαίο λατινικό γράμμα, 1 αριθμός και 1 σύμβολο (π.χ. # $ %)."
                />
                <i
                  class="fa-solid fa-eye position-absolute"
                  id="toggle-pass"
                  style="
                    right: 10px;
                    top: 50%;
                    transform: translateY(-50%);
                    cursor: pointer;
                  "
                ></i>
              </div>

              <div class="text-muted small" id="pass-message"></div>
            </div>

            <!-- confirm password -->
            <label for="confirm_password">*Επιβεβαίωση κωδικού</label>
            <div class="password-row">
              <div class="input-wrapper position-relative">
                <input
                  id="confirm_password"
                  name="confirm_password"
                  type="password"
                  required
                  pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#\$%\^\&\*\(\)\_\+\-\=\[\]\{\}\;\'\:\\|\,\.\?]).{8,14}$"
                  title="Επανάλαβε τον κωδικό (8-14 chars, 1 κεφαλαίο, 1 αριθμός, 1 σύμβολο)."
                />
                <i
                  class="fa-solid fa-eye position-absolute"
                  id="toggle-pass2"
                  style="
                    right: 10px;
                    top: 50%;
                    transform: translateY(-50%);
                    cursor: pointer;
                  "
                ></i>
              </div>
              <div class="text-muted small" id="confirm-pass-message"></div>
            </div>

            <!-- όνομα -->
            <label for="firstname">*Όνομα</label>
            <input
              id="firstname"
              name="firstname"
              type="text"
              required
              placeholder="Όνομα"
              pattern="^[A-Za-zΑ-Ωα-ω].{3,30}$"
              title="Εισάγετε το όνομά σας με ελληνικούς ή λατινικούς χαρακτήρες"
            />

            <!-- επώνυμο -->
            <label for="lastname">*Επώνυμο</label>
            <input
              id="lastname"
              name="lastname"
              type="text"
              required
              placeholder="Επώνυμο"
              pattern="^[A-Za-zΑ-Ωα-ω].{3,30}$"
              title="Εισάγετε το επώνυμό σας με ελληνικούς ή λατινικούς χαρακτήρες"
            />

            <!-- Ημ/νια γέννησης -->
            <label for="birthdate">*Ημερομηνία γέννησης </label>
            <input
              id="birthdate"
              name="birthdate"
              type="date"
              required
              min="1920-01-01"
              max="2011-12-31"

            />

            <!-- Πόλη -->
            <label for="city">*Πόλη Διαμονής</label>
            <input
              id="city"
              name="city"
              type="text"
              required
              placeholder="Πόλη διαμονής"
              pattern="^[A-Za-zΑ-Ωα-ω]{3,30}$"
              title="3-30 χαρακτήρες."
            />

            <!-- Διεύθυνση + lat/lon -->
            <label for="address">*Διεύθυνση </label>

            <div id="address-row position-relative">
              <button
                type="button"
                id="address-button"
                style="cursor: pointer"
                onclick="verifyAddress()"
              >
                Επαλήθευση Διεύθυνσης
              </button>

              <input
                id="address"
                name="address"
                type="text"
                required
                placeholder="Οδός αριθμός"
                pattern="^[A-Za-zΑ-Ωα-ω0-9\\s.,-]{10,150}$"
                title="Οδός , αριθμός"
              />

              <input type="hidden" name="lat" id="lat" />
              <input type="hidden" name="lon" id="lon" />

              <div id="addressMessage" class="small text-muted"></div>

              <div id="map"></div>
              <div id="divID"></div>
            </div>

            <!-- Phone -->
            <label for="telephone">*Τηλέφωνο </label>
            <input
              id="telephone"
              name="telephone"
              type="tel"
              required
              pattern="^\\d{10,14}$"
              title="Εισάγετε 10-14 ψηφία (χωρίς + ή παύλες)."
            />

            <!-- Submit -->
            <button type="button" onclick="Strength(); SimpleRegisterPOST(event)">Εγγραφή</button>

            <h3>Tα πεδία με * είναι υποχρεωτικά</h3>
