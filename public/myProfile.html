<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Το Προφίλ Μου</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/myProfile.css" />
</head>
<body>

<div class="container">
    <button class="btn btn-danger logout-btn" onclick="logoutUser()">Αποσύνδεση</button>
    <h2 class="mb-4">Τα στοιχεία μου</h2>

    <form id="profileForm">

        <!-- username + email den allazoyn -->
        <div class="mb-3">
            <label class="form-label">Username </label>
            <input type="text" id="username" class="form-control" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Email </label>
            <input type="text" id="email" class="form-control" readonly>
        </div>

        <hr>

        <!-- pedia poy allazoun -->
        <div class="mb-3">
            <label class="form-label">Όνομα</label>
            <input type="text" id="firstname" name="firstname" required class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Επώνυμο</label>
            <input type="text" id="lastname" name="lastname" required class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Ημερομηνία γέννησης</label>
            <input type="date" id="birthdate" name="birthdate" required class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Φύλο</label>
            <select id="gender" name="gender" class="form-control">
                <option value="Άντρας">Άντρας</option>
                <option value="Γυναίκα">Γυναίκα</option>
                <option value="Άλλο">Άλλο</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Χώρα</label>
            <input type="text" id="country" name="country" required class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Πόλη</label>
            <input type="text" id="city" name="city" required class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Διεύθυνση</label>
            <input type="text" id="address" name="address" required class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Τηλέφωνο</label>
            <input type="text" id="telephone" name="telephone" required class="form-control">
        </div>

        <input type="hidden" id="lat">
        <input type="hidden" id="lon">

        <button type="submit" class="btn btn-primary mt-3">Αποθήκευση αλλαγών</button>
    </form>

    <div id="msg" class="mt-3"></div>
</div>

<script src="js/myProfile.js"></script>
</body>
</html>
